<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <title>Soda Fountain — Interactive Fluid &amp; Optical Mixing Simulation</title>
    <meta
      name="description"

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link

      rel="stylesheet"
    />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <main id="app" class="fountain-app">
      <h1 class="sr-only">Soda Fountain Fluid Simulation</h1>

      <div id="fountain-overlay" class="fountain-overlay"></div>

    <script type="module" src="/src/main.ts"></script>
